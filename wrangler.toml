name = "inventario-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "inventario"
database_id = "d30caec6-a877-4b1f-8fdc-b09711340da5"

# Los secrets (JWT_SECRET, ESP32_API_KEY) se gestionan con:
#   wrangler secret put JWT_SECRET
#   wrangler secret put ESP32_API_KEY
# Para desarrollo local se leen de .dev.vars (no commitear)

[[r2_buckets]]
binding = "COVERS"
bucket_name = "inventario-covers"

# Cron Trigger (gratuito en el plan Free). Refresca a diario el catálogo de
# números de las colecciones con tracking para que salgan las novedades sin
# tener que entrar en cada colección. 06:00 UTC (~08:00 España en verano).
[triggers]
# A las 06:30 salta otra vez para los trofeos de PSN (fase 2 de videojuegos), en
# su propia invocación para no sumar subpeticiones ni consultas a D1 a las del
# refresco de cómics. Es UNA sola expresión a propósito: la cuenta gratuita
# admite 5 crons en total entre todos los Workers. src/index.ts reparte por minuto.
crons = ["0,30 6 * * *"]

[dev]
port = 8787

# Worker Trofeos (misma cuenta): da el token de PSN y las fechas de los platinos
# por RPC. La NPSSO solo se renueva allí. Ver src/services/trophies.ts.
[[services]]
binding = "TROFEOS"
service = "trofeos"
entrypoint = "TrofeosRpc"
