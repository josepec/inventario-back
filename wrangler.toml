name = "inventario-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "inventario"
database_id = "d30caec6-a877-4b1f-8fdc-b09711340da5"

# Los secrets (JWT_SECRET, ESP32_API_KEY) se gestionan con:
#   wrangler secret put JWT_SECRET
#   wrangler secret put ESP32_API_KEY
# Para desarrollo local se leen de .dev.vars (no commitear)

[[r2_buckets]]
binding = "COVERS"
bucket_name = "inventario-covers"

# Cron Trigger (gratuito en el plan Free). Refresca a diario el catálogo de
# números de las colecciones con tracking para que salgan las novedades sin
# tener que entrar en cada colección. 06:00 UTC (~08:00 España en verano).
[triggers]
crons = ["0 6 * * *"]

[dev]
port = 8787
